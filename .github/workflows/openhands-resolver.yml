name: OpenHands Free Issue Resolver

on:
  issues:
    types: [labeled]

jobs:
  resolve-issue:
    if: github.event.label.name == 'fix-me'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Wymuszamy wersję 20, której wymaga wtyczka OpenHands

      - name: Run OpenHands Resolver
        uses: All-Hands-AI/openhands-github-action@v1
        env:
          LLM_MODEL: "github/gpt-4o"
        with:
          openhands-api-key: ${{ secrets.LLM_API_KEY }}
