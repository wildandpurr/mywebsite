name: OpenHands Free Issue Resolver

on:
  issues:
    types: [labeled]

jobs:
  resolve-issue:
    if: github.event.label.name == 'fix-me'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenHands Resolver
        uses: All-Hands-AI/openhands-github-action@v1
        with:
          openhands-api-key: ${{ secrets.LLM_API_KEY }}
          llm_model: "github/gpt-4o"  # Używa Twojego darmowego tokenu deweloperskiego GitHub
